<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevOps Bootcamp 2026 - Student Card</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
    50%      { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
  }

  .card {
    width: 320px;
    padding: 32px 28px;
    border-radius: 20px;
    background: #ffffff;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    animation: fadeIn 0.8s ease-out;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  }

  .avatar {
    width: 90px;
    height: 90px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 36px;
    font-weight: bold;
  }

  .name {
    margin: 0;
    font-size: 22px;
    color: #0f172a;
  }

  .cohort {
    margin: 6px 0 16px;
    color: #64748b;
    font-size: 14px;
  }

  .badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    animation: pulse 2.5s infinite;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">K</div>
    <h1 class="name">Kumanan</h1>
    <p class="cohort">DevOps Bootcamp 2026</p>
    <span class="badge">Student</span>
  </div>

</body>
</html>
